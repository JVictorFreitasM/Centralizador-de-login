# O backend do IdP nao usa prefixo /api (rotas na raiz) - por isso varios
# location blocks explicitos em vez do unico /api/ usado na referencia.
# Mesma lista de prefixos do vite.config.js (dev).
server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(me|login|logout|password|users|systems|roles|access|audit-logs|authorize|token|health) {
    proxy_pass http://idp-backend:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
  }

  location /.well-known/ {
    proxy_pass http://idp-backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
